<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | Gprince</title>
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="admin.css"></head>
<body>
<div id="login" class="wrap" hidden>
  <form id="login-form" class="card narrow"><h1>Admin sign in</h1>
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <p id="login-msg" role="alert" class="err"></p>
    <button class="btn btn-primary" type="submit">Sign in</button>
    <p><a href="#" id="forgot">Forgot password?</a></p></form>
  <form id="reset-form" class="card narrow" hidden><h1>Set a new password</h1>
    <label>New password (min 10 characters)<input id="newpass" type="password" minlength="10" required autocomplete="new-password"></label>
    <p id="reset-msg" role="alert" class="err"></p><button class="btn btn-primary">Save password</button></form>
</div>
<div id="app" hidden>
  <header class="site"><div class="wrap bar"><strong class="brand">Gprince Admin</strong>
    <button id="logout" class="btn btn-ghost">Sign out</button></div></header>
  <div class="wrap layout"><nav id="side" aria-label="Admin"></nav><main id="view" tabindex="-1"></main></div>
</div>
<dialog id="dlg"><div id="dlg-body"></div><button id="dlg-close" class="btn btn-ghost">Close</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script><script src="admin.js"></script>
</body></html>
